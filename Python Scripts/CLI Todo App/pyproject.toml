[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[project]
name = "cli-todo"
version = "1.0.0"
description = "A simple CLI todo app with JSON storage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["cli", "todo", "task"]
dependencies = [
    "typer>=0.9,<1",
    "platformdirs>=4,<5",
]

[project.scripts]
cli_todo = "cli_todo.cli:app"

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["UP007"]  # allow X | Y only on 3.10+

[tool.ruff.lint.isort]
known-first-party = ["cli_todo"]

[tool.ty.environment]
python-version = "3.11"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
